spring:
  datasource:
    url: jdbc:h2:mem:autoservice_billing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

autoservice:
  jwt:
    secret: test-secret-test-secret-test-secret
  pagamento:
    simulado: true
  mail:
    enabled: false
