server:
  port: 8082

spring:
  application:
    name: autoservice-billing
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autoservice_billing}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  jackson:
    deserialization:
      USE_BIG_DECIMAL_FOR_FLOATS: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

autoservice:
  jwt:
    secret: ${AUTOSERVICE_JWT_SECRET:dev-secret-change-me-please-32b}
  pagamento:
    simulado: ${PAGAMENTO_SIMULADO:true}
  mercadopago:
    base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    external-pos-id: ${MERCADOPAGO_EXTERNAL_POS_ID:autoservice-pos}
  mail:
    enabled: ${MAIL_ENABLED:false}
    to: ${MAIL_TO:cliente@autoservice.local}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
